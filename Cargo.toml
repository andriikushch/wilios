[workspace]
resolver = "2"
members = [
    "crates/wilios-core",
    "crates/wilios-synth",
    "crates/wilios-cli",
    "crates/wilios-mcp",
]
default-members = ["crates/wilios-cli"]
exclude = ["fuzz"]

[workspace.package]
version = "0.0.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/andriikushch/wilios"

[workspace.dependencies]
rand = "0.10"
cpal = "0.18"
num-rational = "0.4"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
