name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-linux:
    name: Build (${{ matrix.suffix }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            suffix: linux-x86_64
            ext: ""
          - target: aarch64-unknown-linux-gnu
            suffix: linux-aarch64
            ext: ""
          - target: x86_64-pc-windows-gnu
            suffix: windows-x86_64
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup update stable && rustup default stable
      - name: Install cross
        run: cargo install cross
      # Bare `cross build` only covers default-members (crates/wilios-cli); both
      # binary crates are built and shipped.
      - name: Build
        run: cross build --release -p wilios-cli -p wilios-mcp --target ${{ matrix.target }}
      - name: Stage binaries
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/wilios${{ matrix.ext }} dist/wilios-${{ matrix.suffix }}${{ matrix.ext }}
          cp target/${{ matrix.target }}/release/wilios-mcp${{ matrix.ext }} dist/wilios-mcp-${{ matrix.suffix }}${{ matrix.ext }}
      - uses: actions/upload-artifact@v4
        with:
          name: wilios-${{ matrix.suffix }}
          path: dist/*

  build-macos:
    name: Build (${{ matrix.suffix }})
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup update stable && rustup default stable && rustup target add ${{ matrix.target }}
      - name: Build
        run: cargo build --release -p wilios-cli -p wilios-mcp --target ${{ matrix.target }}
      - name: Stage binaries
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/wilios dist/wilios-${{ matrix.suffix }}
          cp target/${{ matrix.target }}/release/wilios-mcp dist/wilios-mcp-${{ matrix.suffix }}
      - uses: actions/upload-artifact@v4
        with:
          name: wilios-${{ matrix.suffix }}
          path: dist/*

  publish:
    name: Publish release
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" artifacts/* --generate-notes
