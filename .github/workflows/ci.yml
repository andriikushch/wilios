name: CI

on:
  push:
  pull_request:

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup update stable && rustup default stable && rustup component add rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup update stable && rustup default stable && rustup component add clippy
      - name: Install ALSA
        run: sudo apt-get update -q && sudo apt-get install -y libasound2-dev
      - run: cargo clippy --workspace -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    needs: fmt
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup update stable && rustup default stable
      - name: Install ALSA
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update -q && sudo apt-get install -y libasound2-dev
      - run: cargo test --workspace

  build:
    name: Build (release)
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup update stable && rustup default stable
      - name: Install ALSA
        run: sudo apt-get update -q && sudo apt-get install -y libasound2-dev
      # Bare `cargo build --release` only covers default-members
      # (crates/wilios-cli), so each binary is built explicitly.
      - name: Build wilios (release)
        run: cargo build --release -p wilios-cli
      - name: Build wilios-mcp (release)
        run: cargo build --release -p wilios-mcp

  no-cpal-in-core:
    name: wilios-core, wilios-render and wilios-mcp have no cpal dependency
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup update stable && rustup default stable
      - name: Check wilios-core, wilios-render and wilios-mcp do not depend on cpal
        run: |
          for crate in wilios-core wilios-render wilios-mcp; do
            if cargo tree -p "$crate" | grep -q cpal; then
              echo "$crate must not depend on cpal" >&2
              exit 1
            fi
          done

  smoke:
    name: Smoke (examples schedule; tracks stay aligned)
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup update stable && rustup default stable
      - name: Install ALSA
        run: sudo apt-get update -q && sudo apt-get install -y libasound2-dev
      - run: cargo run -q -p wilios-cli -- smoke examples/bebop_trio.wilios
      - run: cargo run -q -p wilios-cli -- smoke examples/blues_f.wilios
      - run: cargo run -q -p wilios-cli -- smoke examples/bebop_from_lib.wilios
      - run: cargo run -q -p wilios-cli -- smoke examples/blues_from_lib.wilios
      - run: cargo run -q -p wilios-cli -- smoke examples/bossa_from_lib.wilios
      - run: cargo run -q -p wilios-cli -- smoke examples/modal_from_lib.wilios

  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_lexer, fuzz_parser, fuzz_interpreter]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust nightly
        run: rustup toolchain install nightly
      - name: Install ALSA
        run: sudo apt-get update -q && sudo apt-get install -y libasound2-dev
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
      - name: Run fuzz target
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
